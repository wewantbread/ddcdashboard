name: Plugin ClawHub Release

on:
  workflow_dispatch:
    inputs:
      publish_scope:
        description: Publish the selected plugins or all ClawHub-publishable plugins from the workflow ref
        required: true
        default: selected
        type: choice
        options:
          - selected
          - all-publishable
      plugins:
        description: Comma-separated plugin package names to publish when publish_scope=selected
        required: false
        type: string
      ref:
        description: Exact candidate SHA to package when protected tooling runs from another ref
        required: false
        default: ""
        type: string
      release_tag:
        description: Exact release tag bound to the candidate source revision
        required: false
        default: ""
        type: string
      release_publish_run_id:
        description: Approved OpenClaw Release Publish workflow run id
        required: false
        type: string
      release_publish_run_attempt:
        description: Exact approved OpenClaw Release Publish workflow run attempt
        required: false
        type: string
      release_publish_branch:
        description: Branch name of the approving OpenClaw Release Publish workflow run
        required: false
        type: string
      release_publish_full_ref:
        description: Exact full ref of the approving OpenClaw Release Publish workflow tooling
        required: false
        default: ""
        type: string
      release_publish_workflow_sha:
        description: Exact workflow SHA of the approving OpenClaw Release Publish tooling
        required: false
        default: ""
        type: string
      dry_run:
        description: Validate the full ClawHub artifact handoff without publishing.
        required: false
        default: false
        type: boolean

concurrency:
  group: plugin-clawhub-release-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.16.0"
  CLAWHUB_REGISTRY: "https://clawhub.ai"
  CLAWHUB_CLI_PACKAGE: "clawhub@0.23.1"

jobs:
  preview_plugins_clawhub:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ref_revision: ${{ steps.ref.outputs.sha }}
      has_candidates: ${{ steps.plan.outputs.has_candidates }}
      has_bootstrap_candidates: ${{ steps.plan.outputs.has_bootstrap_candidates }}
      has_missing_trusted_publisher: ${{ steps.plan.outputs.has_missing_trusted_publisher }}
      candidate_count: ${{ steps.plan.outputs.candidate_count }}
      bootstrap_candidate_count: ${{ steps.plan.outputs.bootstrap_candidate_count }}
      missing_trusted_publisher_count: ${{ steps.plan.outputs.missing_trusted_publisher_count }}
      skipped_published_count: ${{ steps.plan.outputs.skipped_published_count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      bootstrap_matrix: ${{ steps.plan.outputs.bootstrap_matrix }}
      missing_trusted_publisher_matrix: ${{ steps.plan.outputs.missing_trusted_publisher_matrix }}
      trusted_tooling_identity_json: ${{ steps.tooling_identity.outputs.json }}
      parent_run_attempt: ${{ steps.parent_attempt.outputs.attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0
          filter: blob:none

      - name: Resolve checked-out ref
        id: ref
        env:
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          if [[ -n "${TARGET_REF}" ]]; then
            if git rev-parse --verify --quiet "${TARGET_REF}^{commit}" >/dev/null; then
              target_sha="$(git rev-parse "${TARGET_REF}^{commit}")"
            elif git rev-parse --verify --quiet "origin/${TARGET_REF}^{commit}" >/dev/null; then
              target_sha="$(git rev-parse "origin/${TARGET_REF}^{commit}")"
            else
              echo "Unable to resolve requested publish ref: ${TARGET_REF}" >&2
              exit 1
            fi
            git checkout --detach "${target_sha}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve release parent attempt
        id: parent_attempt
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ATTEMPT: ${{ inputs.release_publish_run_attempt }}
          PARENT_RUN_ID: ${{ inputs.release_publish_run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${PARENT_RUN_ID// }" ]]; then
            [[ -z "${PARENT_RUN_ATTEMPT// }" ]] || {
              echo "release_publish_run_attempt requires release_publish_run_id." >&2
              exit 1
            }
            echo "attempt=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${PARENT_RUN_ATTEMPT// }" ]]; then
            [[ "${GITHUB_ACTOR}" != "github-actions[bot]" ]] || {
              echo "Automated ClawHub publication requires the exact parent run attempt." >&2
              exit 1
            }
            PARENT_RUN_ATTEMPT="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}" --jq '.run_attempt'
            )"
          fi
          [[ "${PARENT_RUN_ID}" =~ ^[1-9][0-9]*$ &&
            "${PARENT_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] || {
            echo "ClawHub publication requires a valid parent run id and attempt." >&2
            exit 1
          }
          echo "attempt=${PARENT_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Capture trusted tooling identity
        id: tooling_identity
        env:
          CANDIDATE_SHA: ${{ steps.ref.outputs.sha }}
          CALLER_FULL_REF: ${{ github.ref }}
          CALLER_REF: ${{ github.ref_name }}
          CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CALLER_RUN_ID: ${{ github.run_id }}
          CALLER_SHA: ${{ github.sha }}
          PARENT_RUN_ATTEMPT: ${{ steps.parent_attempt.outputs.attempt }}
          PARENT_RUN_ID: ${{ inputs.release_publish_run_id }}
          TOOLING_FULL_REF: ${{ inputs.release_publish_full_ref }}
          TOOLING_REF: ${{ inputs.release_publish_branch }}
          TOOLING_SHA: ${{ inputs.release_publish_workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run && 'true' || 'false' }}" == "true" && -z "${PARENT_RUN_ID}" ]]; then
            echo "json=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          identity="$(
            jq -cn \
              --arg candidateRepository "$GITHUB_REPOSITORY" \
              --arg candidateSha "$CANDIDATE_SHA" \
              --arg fullRef "$CALLER_FULL_REF" \
              --arg parentRepository "$GITHUB_REPOSITORY" \
              --arg parentRunAttempt "$PARENT_RUN_ATTEMPT" \
              --arg parentRunId "$PARENT_RUN_ID" \
              --arg parentWorkflow ".github/workflows/openclaw-release-publish.yml" \
              --arg ref "$CALLER_REF" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg runAttempt "$CALLER_RUN_ATTEMPT" \
              --arg runId "$CALLER_RUN_ID" \
              --arg sha "$CALLER_SHA" \
              --arg toolingFullRef "$TOOLING_FULL_REF" \
              --arg toolingRef "$TOOLING_REF" \
              --arg toolingSha "$TOOLING_SHA" \
              --arg workflow ".github/workflows/plugin-clawhub-release.yml" \
              '{
                candidateRepository: $candidateRepository,
                candidateSha: $candidateSha,
                fullRef: $fullRef,
                parentRepository: $parentRepository,
                parentRunAttempt: $parentRunAttempt,
                parentRunId: $parentRunId,
                parentWorkflow: $parentWorkflow,
                ref: $ref,
                repository: $repository,
                runAttempt: $runAttempt,
                runId: $runId,
                sha: $sha,
                toolingFullRef: $toolingFullRef,
                toolingRef: $toolingRef,
                toolingSha: $toolingSha,
                version: 2,
                workflow: $workflow
              }'
          )"
          echo "json=${identity}" >> "$GITHUB_OUTPUT"

      - name: Validate OIDC source matches workflow ref
        env:
          RELEASE_PUBLISH_FULL_REF: ${{ inputs.release_publish_full_ref }}
          RELEASE_PUBLISH_RUN_ATTEMPT: ${{ steps.parent_attempt.outputs.attempt }}
          RELEASE_PUBLISH_RUN_ID: ${{ inputs.release_publish_run_id }}
          RELEASE_PUBLISH_TOOLING_REF: ${{ inputs.release_publish_branch }}
          RELEASE_PUBLISH_TOOLING_SHA: ${{ inputs.release_publish_workflow_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_REF: ${{ inputs.ref }}
          TARGET_SHA: ${{ steps.ref.outputs.sha }}
          WORKFLOW_FULL_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "${TARGET_SHA}" != "${WORKFLOW_SHA}" ]]; then
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "Dry-run publish target differs from workflow ref; allowing validation-only dispatch."
              exit 0
            fi
            [[ "$TARGET_REF" =~ ^[a-f0-9]{40}$ && "$TARGET_REF" == "$TARGET_SHA" ]] || {
              echo "Split-ref ClawHub publication requires ref to be the exact candidate SHA." >&2
              exit 1
            }
            if [[ "$WORKFLOW_FULL_REF" == "refs/heads/main" ]]; then
              [[ "$WORKFLOW_REF" == "main" ]] || {
                echo "Split-ref ClawHub main tooling ref is inconsistent." >&2
                exit 1
              }
            else
              [[ "$WORKFLOW_FULL_REF" =~ ^refs/tags/release-publish/([a-f0-9]{12})-[1-9][0-9]*$ &&
                "${BASH_REMATCH[1]}" == "${WORKFLOW_SHA:0:12}" ]] || {
                echo "Split-ref ClawHub publication requires current main or an exact SHA-prefixed protected tooling tag." >&2
                exit 1
              }
            fi
            [[ "$RELEASE_PUBLISH_TOOLING_REF" == "$WORKFLOW_REF" &&
              "$RELEASE_PUBLISH_FULL_REF" == "$WORKFLOW_FULL_REF" &&
              "$RELEASE_PUBLISH_TOOLING_SHA" == "$WORKFLOW_SHA" ]] || {
              echo "Split-ref ClawHub publication tooling identity does not match the executing workflow." >&2
              exit 1
            }
            [[ "$RELEASE_PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ &&
              "$RELEASE_PUBLISH_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "Split-ref ClawHub publication requires the exact parent run id and attempt." >&2
              exit 1
            }
            [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*(-[a-z]+(\.[1-9][0-9]*)?)?$ ]] || {
              echo "Split-ref ClawHub publication requires an exact release tag." >&2
              exit 1
            }
            git fetch --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$TARGET_SHA" ]] || {
              echo "ClawHub release tag does not resolve to the frozen candidate SHA." >&2
              exit 1
            }
            echo "Using trusted tooling ${WORKFLOW_SHA} with frozen candidate ${TARGET_SHA}."
          fi

      - name: Validate ref is on a trusted publish branch
        env:
          TRUSTED_PUBLISH_BRANCH: ${{ inputs.release_publish_branch || github.ref_name }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor HEAD origin/main; then
            exit 0
          fi
          while IFS= read -r release_ref; do
            if git merge-base --is-ancestor HEAD "${release_ref}"; then
              exit 0
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/release)
          if [[ "${TRUSTED_PUBLISH_BRANCH}" =~ ^tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z$ ]]; then
            alpha_branch="${TRUSTED_PUBLISH_BRANCH}"
            git fetch --no-tags origin "+refs/heads/${alpha_branch}:refs/remotes/origin/${alpha_branch}"
            if git merge-base --is-ancestor HEAD "refs/remotes/origin/${alpha_branch}"; then
              exit 0
            fi
          fi
          echo "Plugin ClawHub publishes must target a commit reachable from main, release/*, or the matching Tideclaw alpha branch." >&2
          exit 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"

      - name: Validate publishable plugin metadata
        env:
          PUBLISH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_scope || '' }}
          RELEASE_PLUGINS: ${{ github.event_name == 'workflow_dispatch' && inputs.plugins || '' }}
          BASE_REF: ${{ github.event_name != 'workflow_dispatch' && github.event.before || '' }}
          HEAD_REF: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PUBLISH_SCOPE}" ]]; then
            release_args=(--selection-mode "${PUBLISH_SCOPE}")
            if [[ -n "${RELEASE_PLUGINS}" ]]; then
              release_args+=(--plugins "${RELEASE_PLUGINS}")
            fi
            pnpm release:plugins:clawhub:check -- "${release_args[@]}"
          elif [[ -n "${BASE_REF}" ]]; then
            pnpm release:plugins:clawhub:check -- --base-ref "${BASE_REF}" --head-ref "${HEAD_REF}"
          else
            pnpm release:plugins:clawhub:check
          fi

      - name: Resolve plugin release plan
        id: plan
        env:
          PUBLISH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_scope || '' }}
          RELEASE_PLUGINS: ${{ github.event_name == 'workflow_dispatch' && inputs.plugins || '' }}
          BASE_REF: ${{ github.event_name != 'workflow_dispatch' && github.event.before || '' }}
          HEAD_REF: ${{ steps.ref.outputs.sha }}
          CLAWHUB_REGISTRY: ${{ env.CLAWHUB_REGISTRY }}
        run: |
          set -euo pipefail
          mkdir -p .local
          if [[ -n "${PUBLISH_SCOPE}" ]]; then
            plan_args=(--selection-mode "${PUBLISH_SCOPE}")
            if [[ -n "${RELEASE_PLUGINS}" ]]; then
              plan_args+=(--plugins "${RELEASE_PLUGINS}")
            fi
            node --import tsx scripts/plugin-clawhub-release-plan.ts "${plan_args[@]}" > .local/plugin-clawhub-release-plan.json
          elif [[ -n "${BASE_REF}" ]]; then
            node --import tsx scripts/plugin-clawhub-release-plan.ts --base-ref "${BASE_REF}" --head-ref "${HEAD_REF}" > .local/plugin-clawhub-release-plan.json
          else
            node --import tsx scripts/plugin-clawhub-release-plan.ts > .local/plugin-clawhub-release-plan.json
          fi

          cat .local/plugin-clawhub-release-plan.json

          candidate_count="$(jq -r '.candidates | length' .local/plugin-clawhub-release-plan.json)"
          bootstrap_candidate_count="$(jq -r '.bootstrapCandidates | length' .local/plugin-clawhub-release-plan.json)"
          missing_trusted_publisher_count="$(jq -r '.missingTrustedPublisher | length' .local/plugin-clawhub-release-plan.json)"
          skipped_published_count="$(jq -r '.skippedPublished | length' .local/plugin-clawhub-release-plan.json)"
          has_candidates="false"
          if [[ "${candidate_count}" != "0" ]]; then
            has_candidates="true"
          fi
          has_bootstrap_candidates="false"
          if [[ "${bootstrap_candidate_count}" != "0" ]]; then
            has_bootstrap_candidates="true"
          fi
          has_missing_trusted_publisher="false"
          if [[ "${missing_trusted_publisher_count}" != "0" ]]; then
            has_missing_trusted_publisher="true"
          fi
          matrix_json="$(jq -c '.candidates' .local/plugin-clawhub-release-plan.json)"
          bootstrap_matrix_json="$(jq -c '.bootstrapCandidates' .local/plugin-clawhub-release-plan.json)"
          missing_trusted_publisher_matrix_json="$(jq -c '.missingTrustedPublisher' .local/plugin-clawhub-release-plan.json)"

          {
            echo "candidate_count=${candidate_count}"
            echo "bootstrap_candidate_count=${bootstrap_candidate_count}"
            echo "missing_trusted_publisher_count=${missing_trusted_publisher_count}"
            echo "skipped_published_count=${skipped_published_count}"
            echo "has_candidates=${has_candidates}"
            echo "has_bootstrap_candidates=${has_bootstrap_candidates}"
            echo "has_missing_trusted_publisher=${has_missing_trusted_publisher}"
            echo "matrix=${matrix_json}"
            echo "bootstrap_matrix=${bootstrap_matrix_json}"
            echo "missing_trusted_publisher_matrix=${missing_trusted_publisher_matrix_json}"
          } >> "$GITHUB_OUTPUT"

          echo "Plugin release candidates:"
          jq -r '.candidates[]? | "- \(.packageName)@\(.version) [\(.publishTag)] from \(.packageDir)"' .local/plugin-clawhub-release-plan.json

          echo "Bootstrap candidates requiring token bootstrap:"
          jq -r '.bootstrapCandidates[]? | "- \(.packageName)@\(.version) [\(.publishTag)] from \(.packageDir)"' .local/plugin-clawhub-release-plan.json

          echo "Missing trusted publisher candidates:"
          jq -r '.missingTrustedPublisher[]? | "- \(.packageName)@\(.version) [\(.publishTag)] from \(.packageDir)"' .local/plugin-clawhub-release-plan.json

          echo "Already published / skipped:"
          jq -r '.skippedPublished[]? | "- \(.packageName)@\(.version)"' .local/plugin-clawhub-release-plan.json

      - name: Fail when trusted publisher is missing
        if: steps.plan.outputs.missing_trusted_publisher_count != '0'
        run: |
          echo "::error::One or more ClawHub packages exist but do not have trusted publishing configured. Configure trusted publishing before running the normal OIDC publish workflow."
          jq -r '.missingTrustedPublisher[]? | "::error::Missing trusted publisher: \(.packageName)@\(.version). Configure trusted publishing for openclaw/openclaw, workflow plugin-clawhub-release.yml."' .local/plugin-clawhub-release-plan.json
          exit 1

      - name: Fail normal publish when bootstrap is required
        if: steps.plan.outputs.bootstrap_candidate_count != '0'
        run: |
          echo "::error::One or more ClawHub packages do not exist yet and require the token-gated Plugin ClawHub New bootstrap workflow before normal OIDC publish can run."
          jq -r '.bootstrapCandidates[]? | "::error::Bootstrap required: \(.packageName)@\(.version). Dispatch plugin-clawhub-new.yml for this package, then rerun the normal release."' .local/plugin-clawhub-release-plan.json
          exit 1

      - name: Fail manual publish when target versions already exist
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.publish_scope == 'selected' && steps.plan.outputs.skipped_published_count != '0'
        run: |
          echo "::error::One or more selected plugin versions already exist on ClawHub. Bump the version before running a real publish."
          exit 1

      - name: Validate Tideclaw alpha plugin channels
        env:
          TRUSTED_PUBLISH_BRANCH: ${{ inputs.release_publish_branch || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TRUSTED_PUBLISH_BRANCH}" =~ ^tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z$ ]]; then
            exit 0
          fi
          invalid="$(
            jq -r '.candidates[]? | select(.publishTag != "alpha" or .channel != "alpha") | "- \(.packageName)@\(.version) [\(.publishTag)]"' .local/plugin-clawhub-release-plan.json
          )"
          if [[ -n "${invalid}" ]]; then
            echo "Tideclaw alpha ClawHub publishes may only publish alpha plugin versions." >&2
            printf '%s\n' "${invalid}" >&2
            exit 1
          fi

  validate_release_publish_approval:
    name: Validate release publish approval
    needs: preview_plugins_clawhub
    if: github.event_name == 'workflow_dispatch' && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate release publish approval run
        env:
          ALLOW_COMPLETED_SUCCESSFUL_PARENT: "true"
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_RUN_ID: ${{ inputs.release_publish_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.preview_plugins_clawhub.outputs.parent_run_attempt }}
          EXPECTED_WORKFLOW_FULL_REF: ${{ inputs.release_publish_full_ref || github.ref }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.release_publish_workflow_sha || github.sha }}
          EXPECTED_WORKFLOW_BRANCH: ${{ inputs.release_publish_branch || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_PUBLISH_RUN_ID// }" ]]; then
            if [[ "${GITHUB_ACTOR}" == "github-actions[bot]" ]]; then
              echo "Plugin ClawHub publish dispatched by another workflow must include release_publish_run_id." >&2
              exit 1
            fi
            echo "Direct Plugin ClawHub Release dispatch; relying on this workflow's clawhub-plugin-release environment approval."
            exit 0
          fi
          direct_recovery=false
          if [[ "${GITHUB_ACTOR}" != "github-actions[bot]" ]]; then
            direct_recovery=true
            echo "Direct Plugin ClawHub Release recovery with release_publish_run_id; relying on this workflow's clawhub-plugin-release environment approval."
          fi
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_PUBLISH_RUN_ID}/attempts/${EXPECTED_RUN_ATTEMPT}" --jq '{workflowName: .name, headBranch: .head_branch, headSha: .head_sha, event, status, conclusion, url: .html_url, runAttempt: .run_attempt, repository: .repository.full_name, path}')"
          printf '%s' "$RUN_JSON" | DIRECT_RELEASE_RECOVERY="${direct_recovery}" node scripts/validate-release-publish-approval.mjs

  pack_plugins_clawhub_artifacts:
    needs: [preview_plugins_clawhub, validate_release_publish_approval]
    if: github.event_name == 'workflow_dispatch' && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        plugin: ${{ fromJson(needs.preview_plugins_clawhub.outputs.matrix) }}
    steps:
      - name: Validate target revision
        env:
          TARGET_SHA: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
        run: |
          if [[ ! "${TARGET_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "ClawHub pack target must be a full lowercase commit SHA; got: ${TARGET_SHA}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"
          install-deps: "true"

      - name: Verify package-local runtime build
        run: node --import tsx scripts/check-plugin-npm-runtime-builds.mts --package "${{ matrix.plugin.packageDir }}"

      - name: Install pinned ClawHub CLI wrapper
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/clawhub" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec npm exec --yes --package "${CLAWHUB_CLI_PACKAGE}" -- clawhub "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/clawhub"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Pack ClawHub package artifact
        env:
          CLAWHUB_REGISTRY: ${{ env.CLAWHUB_REGISTRY }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
          SOURCE_REF: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          PACKAGE_TAG: ${{ matrix.plugin.publishTag }}
          PACKAGE_DIR: ${{ matrix.plugin.packageDir }}
          OPENCLAW_CLAWHUB_PACK_OUTPUT_DIR: ${{ runner.temp }}/clawhub-package-artifact
        run: bash scripts/plugin-clawhub-publish.sh --pack "${PACKAGE_DIR}"

      - name: Upload ClawHub package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.plugin.artifactName }}
          path: ${{ runner.temp }}/clawhub-package-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7

  aggregate_clawhub_transactions:
    name: Aggregate ClawHub transaction manifest
    needs: [preview_plugins_clawhub, pack_plugins_clawhub_artifacts]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout transaction tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"

      - name: Download packed ClawHub artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: clawhub-package-*
          path: ${{ runner.temp }}/clawhub-package-artifacts

      - name: Build exact ClawHub transaction manifest
        env:
          CANDIDATE_SHA: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
          MATRIX_JSON: ${{ needs.preview_plugins_clawhub.outputs.matrix }}
          TOOLING_FULL_REF: ${{ inputs.release_publish_full_ref }}
          TOOLING_REF: ${{ inputs.release_publish_branch }}
          TOOLING_SHA: ${{ inputs.release_publish_workflow_sha }}
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/openclaw-clawhub-transactions"
          mkdir -p "${output_dir}"
          node --import tsx scripts/lib/openclaw-clawhub-authorization.mts transactions \
            --artifacts-dir "${RUNNER_TEMP}/clawhub-package-artifacts" \
            --matrix-json "${MATRIX_JSON}" \
            --candidate-repository "${GITHUB_REPOSITORY}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --child-repository "${GITHUB_REPOSITORY}" \
            --child-run-id "${GITHUB_RUN_ID}" \
            --child-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --child-ref "${GITHUB_REF_NAME}" \
            --child-full-ref "${GITHUB_REF}" \
            --child-head-sha "${GITHUB_SHA}" \
            --tooling-ref "${TOOLING_REF}" \
            --tooling-full-ref "${TOOLING_FULL_REF}" \
            --tooling-sha "${TOOLING_SHA}" \
            --output "${output_dir}/transactions.json"

      - name: Upload ClawHub transaction manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-clawhub-transactions-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-clawhub-transactions/transactions.json
          if-no-files-found: error
          retention-days: 30

  approve_plugins_clawhub_release:
    needs: [preview_plugins_clawhub, aggregate_clawhub_transactions]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run != true && needs.preview_plugins_clawhub.outputs.has_candidates == 'true' && needs.aggregate_clawhub_transactions.result == 'success'
    runs-on: ubuntu-latest
    environment: clawhub-plugin-release
    permissions:
      contents: read
    steps:
      - name: Approve Plugin ClawHub release publish
        run: |
          echo "Approved CLAW-277 03 - Split OpenClaw plugin ClawHub publishing into OIDC release and token bootstrap workflows release publish gate."

  publish_plugins_clawhub:
    needs:
      [
        preview_plugins_clawhub,
        pack_plugins_clawhub_artifacts,
        aggregate_clawhub_transactions,
        approve_plugins_clawhub_release,
      ]
    if: always() && github.event_name == 'workflow_dispatch' && needs.preview_plugins_clawhub.outputs.has_candidates == 'true' && needs.pack_plugins_clawhub_artifacts.result == 'success' && ((inputs.dry_run == true && needs.aggregate_clawhub_transactions.result == 'skipped' && needs.approve_plugins_clawhub_release.result == 'skipped') || (inputs.dry_run != true && needs.aggregate_clawhub_transactions.result == 'success' && needs.approve_plugins_clawhub_release.result == 'success'))
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@845c6d3bdb1a36573d8d28be2a8fb85a3c476720
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        plugin: ${{ fromJson(needs.preview_plugins_clawhub.outputs.matrix) }}
    with:
      package_artifact_name: ${{ matrix.plugin.artifactName }}
      dry_run: ${{ inputs.dry_run }}
      wait_for_publication: false
      registry: https://clawhub.ai
      site: https://clawhub.ai
      family: ${{ contains(fromJson('["@openclaw/acpx","@openclaw/diffs","@openclaw/feishu"]'), matrix.plugin.packageName) && 'bundle-plugin' || '' }}
      tags: ${{ matrix.plugin.publishTag }}
      source_repo: ${{ github.repository }}
      source_commit: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
      source_ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      source_path: ${{ matrix.plugin.packageDir }}
      inspector_artifact_name: ${{ matrix.plugin.artifactName }}-inspector
      publish_json_artifact_name: ${{ matrix.plugin.artifactName }}-publish-json
      trusted_tooling_identity_json: ${{ needs.preview_plugins_clawhub.outputs.trusted_tooling_identity_json }}

  verify_staged_clawhub_packages:
    name: Verify staged ClawHub package (${{ matrix.plugin.packageName }})
    needs: [preview_plugins_clawhub, publish_plugins_clawhub]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        plugin: ${{ fromJson(needs.preview_plugins_clawhub.outputs.matrix) }}
    steps:
      - name: Download ClawHub publish result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.plugin.artifactName }}-publish-json
          path: ${{ runner.temp }}/clawhub-publish-json

      - name: Require staged publication
        env:
          PACKAGE_NAME: ${{ matrix.plugin.packageName }}
          PACKAGE_VERSION: ${{ matrix.plugin.version }}
        run: |
          set -euo pipefail
          publish_json="${RUNNER_TEMP}/clawhub-publish-json/package-publish.json"
          jq -e \
            --arg name "${PACKAGE_NAME}" \
            --arg version "${PACKAGE_VERSION}" \
            '.name == $name and .version == $version and
             .status == "pending-publication" and .publicationStatus == "pending" and
             (.attemptId | type == "string" and length > 0)' \
            "${publish_json}" >/dev/null

  clawhub_staged:
    name: Confirm staged ClawHub publication
    needs: [preview_plugins_clawhub, verify_staged_clawhub_packages]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run != true && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm every package is staged
        env:
          STAGED_RESULT: ${{ needs.verify_staged_clawhub_packages.result }}
        run: |
          set -euo pipefail
          [[ "${STAGED_RESULT}" == "success" ]] || {
            echo "One or more ClawHub packages did not reach staged publication." >&2
            exit 1
          }

  verify_published_clawhub_package:
    name: Verify published ClawHub package after parent success (${{ matrix.plugin.packageName }})
    needs: [preview_plugins_clawhub, clawhub_staged]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        plugin: ${{ fromJson(needs.preview_plugins_clawhub.outputs.matrix) }}
    steps:
      - name: Require exact successful release parent attempt
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_FULL_REF: ${{ inputs.release_publish_full_ref }}
          PARENT_REF: ${{ inputs.release_publish_branch }}
          PARENT_RUN_ATTEMPT: ${{ needs.preview_plugins_clawhub.outputs.parent_run_attempt }}
          PARENT_RUN_ID: ${{ inputs.release_publish_run_id }}
          PARENT_SHA: ${{ inputs.release_publish_workflow_sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))
          while true; do
            run_json="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/attempts/${PARENT_RUN_ATTEMPT}"
            )"
            jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg run_id "${PARENT_RUN_ID}" \
              --arg attempt "${PARENT_RUN_ATTEMPT}" \
              --arg ref "${PARENT_REF}" \
              --arg sha "${PARENT_SHA}" \
              '.repository.full_name == $repository and
               (.id | tostring) == $run_id and
               (.run_attempt | tostring) == $attempt and
               .path == ".github/workflows/openclaw-release-publish.yml" and
               .head_branch == $ref and .head_sha == $sha and
               .event == "workflow_dispatch"' <<<"${run_json}" >/dev/null
            status="$(jq -r '.status' <<<"${run_json}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
            if [[ "${status}" == "completed" ]]; then
              [[ "${conclusion}" == "success" ]] || {
                echo "Exact release parent attempt finished with ${conclusion}; refusing public verification." >&2
                exit 1
              }
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Exact release parent attempt did not finish within 60 minutes." >&2
              exit 1
            fi
            sleep 20
          done
          [[ "${PARENT_FULL_REF}" == "refs/heads/main" ||
            "${PARENT_FULL_REF}" == "refs/tags/${PARENT_REF}" ]] || {
            echo "Exact release parent full ref is not current main or the protected tooling tag." >&2
            exit 1
          }

      - name: Checkout verification tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "false"

      - name: Download published package input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.plugin.artifactName }}
          path: ${{ runner.temp }}/clawhub-package-artifact

      - name: Verify published ClawHub package
        env:
          CLAWHUB_REGISTRY: ${{ env.CLAWHUB_REGISTRY }}
          PACKAGE_NAME: ${{ matrix.plugin.packageName }}
          PACKAGE_VERSION: ${{ matrix.plugin.version }}
          PACKAGE_TAG: ${{ matrix.plugin.publishTag }}
        run: |
          set -euo pipefail
          node scripts/verify-clawhub-published-artifact.mjs \
            --expected-artifact-dir "${RUNNER_TEMP}/clawhub-package-artifact" \
            --package-name "${PACKAGE_NAME}" \
            --package-version "${PACKAGE_VERSION}" \
            --publish-tag "${PACKAGE_TAG}" \
            --registry "${CLAWHUB_REGISTRY}"
